plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'app.orbitspace.launcher'
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion = "29.0.13846066"

    defaultConfig {
        // Change this (and app_name in res/values/strings.xml) to rebrand the app.
        applicationId "app.orbitspace.launcher"
        minSdk rootProject.ext.minSdk
        // The engine needs the host to target API 28: newer targets switch on
        // platform restrictions that break running guest apps in-process.
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
    }

    // One APK per CPU type plus a universal one. A 64-bit build can only run
    // 64-bit guest apps, and a 32-bit build only 32-bit ones.
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk true
        }
    }

    signingConfigs {
        // A fixed key so every build can be installed over the previous one
        // without wiping the apps inside the space. The password is public:
        // replace this key before giving builds to anyone else.
        shared {
            storeFile rootProject.file('signing/orbit-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            // Not debuggable, so ART runs guest code at full speed.
            signingConfig signingConfigs.shared
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            // The engine loads its native library from the extracted lib directory.
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            output.outputFileName = "OrbitSpace_${variant.versionName}_${output.baseName}.apk"
        }
    }
}

dependencies {
    implementation project(':Bcore')
}
