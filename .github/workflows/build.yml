name: Build APK

on:
  push:
    branches: [main, master, orbit-space]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # GitHub's Ubuntu runners come with the Android SDK already installed.
      # Gradle downloads the exact platform, build tools and NDK it needs, as
      # long as the licenses have been accepted.
      - name: Accept Android SDK licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        with:
          name: orbit-space-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # Also puts the release APKs on a branch of their own, so they can be
      # downloaded straight from the repository without unzipping an artifact.
      # The branch is replaced on every build and holds a single commit.
      - name: Publish the release APKs to the orbit-space-apk branch
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/apk-out"
          cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/apk-out/"
          cd "$RUNNER_TEMP/apk-out"
          sha256sum *.apk > SHA256SUMS.txt
          git init -q -b orbit-space-apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "APKs built from ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" orbit-space-apk

      - name: Upload build reports if the build failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
