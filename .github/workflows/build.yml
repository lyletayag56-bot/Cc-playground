name: Build APK

on:
  push:
    branches: [main, master, orbit-space]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # GitHub's Ubuntu runners come with the Android SDK already installed.
      # Gradle downloads the exact platform, build tools and NDK it needs, as
      # long as the licenses have been accepted.
      - name: Accept Android SDK licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        with:
          name: orbit-space-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload build reports if the build failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
